<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">

	<meta http-equiv="refresh" content="0; url=https://sleeprapp.org/privacy">
	<link rel="canonical" href="https://sleeprapp.org/privacy">
	<title>Sleepr — Privacy Policy has moved</title>
	<style>
		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

			color: #1a1a1a;

		}

		.cta {
			display: inline-block;

			padding: 10px 20px;

		It now lives at

	<script>
